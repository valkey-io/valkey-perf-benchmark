name: Set Command Scenarios

# Runs the set command matrix (configs/set-commands.json) against one Valkey
# build: any repository and ref, including a pull request head such as
# refs/pull/4959/head or a branch in a fork.
on:
  workflow_dispatch:
    inputs:
      valkey_repo:
        description: "Valkey repository to build (owner/name)"
        required: false
        default: "valkey-io/valkey"
        type: string
      valkey_ref:
        description: "Branch, tag, SHA or refs/pull/<n>/head to build"
        required: false
        default: "unstable"
        type: string
      scenario:
        description: "Comma-separated set_matrix command ids (e.g. sismember,srem_sadd), or all"
        required: false
        default: "all"
        type: string
      num_runs:
        description: "Number of runs of each scenario"
        required: false
        default: 3
        type: number
      runner:
        description: "Self-hosted runner label, or a GitHub-hosted image such as ubuntu-latest"
        required: false
        default: "ec2-al-2023-benchmarking-arm64"
        type: string
      overrides:
        description: 'JSON merged into the config, e.g. {"set_matrix": {"shapes": {"listpack16": {"members": 32}}, "run_ttl_mixes": ["none"]}}'
        required: false
        default: "{}"
        type: string

# Runs on the shared self-hosted runner queue behind the other benchmark
# workflows; GitHub-hosted runs do not queue behind each other.
concurrency:
  group: ${{ startsWith(inputs.runner, 'ubuntu-') && format('set-scenarios-{0}', github.run_id) || inputs.runner }}
  cancel-in-progress: false

defaults:
  run:
    shell: "bash -Eeuo pipefail -x {0}"

permissions:
  contents: read

jobs:
  set_scenarios:
    runs-on: ${{ startsWith(inputs.runner, 'ubuntu-') && inputs.runner || fromJSON(format('["self-hosted","{0}"]', inputs.runner)) }}
    timeout-minutes: 7200
    env:
      HOSTED: ${{ startsWith(inputs.runner, 'ubuntu-') }}
      VALKEY_REPO: ${{ inputs.valkey_repo }}
      VALKEY_REF: ${{ inputs.valkey_ref }}
      SCENARIO: ${{ inputs.scenario }}
      NUM_RUN: ${{ inputs.num_runs }}
      # fromJSON rejects a malformed override before anything is built.
      OVERRIDES: ${{ toJSON(fromJSON(inputs.overrides)) }}
    steps:
      - name: Set up Python (self-hosted Amazon Linux)
        if: env.HOSTED != 'true'
        uses: kishaningithub/setup-python-amazon-linux@63dc7bd642c6a564d0a93dd4b1cbe3e448ce3621
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Set up Python (GitHub-hosted)
        if: env.HOSTED == 'true'
        uses: actions/setup-python@3605726ffa6ef7750b99ff496e5b88248b414e26 # v4.9.0
        with:
          python-version: "3.10"

      - name: Checkout Valkey under test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ inputs.valkey_repo }}
          ref: ${{ inputs.valkey_ref }}
          path: valkey

      - name: Checkout Valkey Benchmark
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: valkey-perf-benchmark

      - name: Install dependencies
        working-directory: valkey-perf-benchmark
        run: |
          if [[ "$HOSTED" == "true" ]]; then
            sudo apt-get update
            sudo apt-get install -y build-essential
          else
            sudo dnf groupinstall "Development Tools" -y
            sudo dnf install -y gcc gcc-c++ make python3-devel openssl-devel bzip2-devel libffi-devel
          fi
          pip install -r requirements.txt

      - name: Record the commit under test
        working-directory: valkey
        run: |
          # benchmark.py checks out and builds this commit in ../valkey.
          echo "VALKEY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Resolve config
        working-directory: valkey-perf-benchmark
        run: |
          mkdir -p "results/$VALKEY_SHA"
          python scripts/resolve_set_matrix.py \
            --config configs/set-commands.json \
            --commands "$SCENARIO" \
            --overrides "$OVERRIDES" \
            --out "results/$VALKEY_SHA/resolved-config.json"
          cat "results/$VALKEY_SHA/resolved-config.json"

      - name: Run set scenarios (GitHub-hosted)
        if: env.HOSTED == 'true'
        working-directory: valkey-perf-benchmark
        run: |
          python ./benchmark.py \
            --commits "$VALKEY_SHA" \
            --valkey-path ../valkey \
            --config "results/$VALKEY_SHA/resolved-config.json" \
            --repository "$VALKEY_REPO" \
            --results-dir results \
            --runs "$NUM_RUN"

      - name: Run set scenarios (self-hosted)
        if: env.HOSTED != 'true'
        working-directory: valkey-perf-benchmark
        run: |
          python ./benchmark.py \
            --commits "$VALKEY_SHA" \
            --valkey-path ../valkey \
            --config "results/$VALKEY_SHA/resolved-config.json" \
            --repository "$VALKEY_REPO" \
            --target-ip ${{ secrets.EC2_ARM64_IP }} \
            --results-dir results \
            --runs "$NUM_RUN"

      - name: Summarize
        if: always()
        working-directory: valkey-perf-benchmark
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, glob
          for path in glob.glob("results/*/metrics.json"):
              rows = json.load(open(path))
              print(f"### {path}: {len(rows)} rows\n")
              print("| test_id | status | server ops/s | client rps | window complete | bytes/key | error |")
              print("|---|---|---|---|---|---|---|")
              for r in rows:
                  print(f"| {r.get('test_id')} | {r.get('status')} | {r.get('server_ops_s', '')} | "
                        f"{r.get('rps', '')} | {r.get('window_complete', '')} | "
                        f"{r.get('populate_bytes_per_key', '')} | {str(r.get('error', ''))[:80]} |")
          EOF
          grep -h "Skipping scenario" results/*/logs.txt | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload results and resolved config
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: set-scenarios-results
          path: valkey-perf-benchmark/results

      - name: Cleanup any running valkey processes and files
        if: always() && env.HOSTED != 'true'
        continue-on-error: true
        run: |
          pkill -f valkey || echo "No valkey processes found to kill"
          rm -rf *
