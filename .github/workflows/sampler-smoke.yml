name: Per-Second Sampler Smoke Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'metrics_sampler.py'
      - 'valkey_benchmark.py'
      - 'configs/sampler-smoke.json'
      - 'scripts/verify_sampler_output.py'
      - '.github/workflows/sampler-smoke.yml'

defaults:
  run:
    shell: "bash -Eeuo pipefail -x {0}"

permissions:
  contents: read

jobs:
  sampler-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout valkey
        uses: actions/checkout@v4
        with:
          repository: valkey-io/valkey
          ref: unstable
          path: valkey
          fetch-depth: 1

      - name: Checkout valkey-perf-benchmark
        uses: actions/checkout@v4
        with:
          path: valkey-perf-benchmark

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: valkey-perf-benchmark/requirements.txt

      - name: Install dependencies
        working-directory: valkey-perf-benchmark
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ make python3-dev libssl-dev
          pip install -r requirements.txt

      - name: Build valkey
        working-directory: valkey
        run: |
          echo "Building valkey-server, valkey-cli and valkey-benchmark..."
          make distclean || true
          make -j$(nproc)

          for binary in valkey-server valkey-cli valkey-benchmark; do
            if [ ! -f "src/$binary" ]; then
              echo "$binary build failed"
              exit 1
            fi
            ls -lh "src/$binary"
          done
          ./src/valkey-server --version

      - name: Run sampler smoke benchmark
        working-directory: valkey-perf-benchmark
        run: |
          echo "Config: configs/sampler-smoke.json"
          echo "GitHub runner cores: $(nproc)"

          python benchmark.py \
            --mode both \
            --valkey-path ../valkey \
            --config configs/sampler-smoke.json \
            --commits HEAD \
            --results-dir results

      - name: Verify sampled time series
        working-directory: valkey-perf-benchmark
        run: |
          python scripts/verify_sampler_output.py results configs/sampler-smoke.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sampler-smoke-results
          path: valkey-perf-benchmark/results/

      - name: Cleanup
        if: always()
        run: |
          pkill -f valkey || echo "No valkey processes to kill"
