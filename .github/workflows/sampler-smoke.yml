name: Per-Second Sampler Smoke Test

on:
  workflow_dispatch:
  pull_request:

defaults:
  run:
    shell: "bash -Eeuo pipefail -x {0}"

permissions:
  contents: read

jobs:
  sampler-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@3605726ffa6ef7750b99ff496e5b88248b414e26 # v4.9.0
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          pip install -r requirements.txt

      - name: Run sampler smoke benchmark
        run: |
          python benchmark.py \
            --config configs/sampler-smoke.json \
            --commits HEAD \
            --results-dir results

      - name: Verify sampled time series
        run: |
          python scripts/verify_sampler_output.py results configs/sampler-smoke.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sampler-smoke-results
          path: results/
